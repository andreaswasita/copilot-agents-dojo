# fleet.yaml — declarative ISD-aligned agent org for the AI Delivery practice
# Source of truth for the Paperclip company. Apply with: python fleet/apply.py --dry-run | --apply
# managedBy: this manifest. New (apply: now|defer) agents are created PAUSED.
#
# ─── SCHEMA REFERENCE ────────────────────────────────────────────────────────
# schemaVersion: int                    # bump on breaking schema changes
# company:                              # target Paperclip company (must exist)
#   id:   <uuid>
#   name: <string>
# workstreams: [<string>, ...]          # ISD workstream taxonomy (informational)
#
# existing: []                          # agents managed ELSEWHERE — never mutated
#   - name:       <PascalCase, unique>  # must match live agent name
#     id:         <uuid>                # must match live agent id (validated in preflight)
#     isd_role:   <string>              # ISD role label (informational)
#     persona:    <repo-relative path>  # .dojo/agents/<role>.md
#     reports_to: <name | "Operator">   # must resolve to another agent or Operator
#     status:     <paused|idle|...>     # informational; live status is authoritative
#     protected:  true                  # OPTIONAL — CAO/PRReviewer only; refuses delete/mutate
#
# agents: []                            # NEW agents created by apply.py (always PAUSED)
#   - name, isd_role, persona, reports_to, status, workstream, phases   # as above
#     id:           <uuid>              # ABSENT initially; apply.py writes it back after create
#     apply:        <now | defer>       # now=create on --apply; defer=skip (preflight ignores)
#     model:        <string>            # OPTIONAL — appended to copilot --model
#     capabilities: |                   # REQUIRED; first line MUST start with:
#       Persona profile: <persona-path> # …enforced by preflight (durable persona pointer)
#
# ─── INVARIANTS (enforced by apply.py) ───────────────────────────────────────
#  * CAO and PRReviewer are PROTECTED (read-only, never mutated, never deleted).
#  * existing[] entries are never mutated — only validated against live state.
#  * apply:now agents are created PAUSED, heartbeat OFF, canCreateAgents=false.
#  * Every create is re-read and asserted paused; failures abort with --rollback hint.
#  * Pre-apply snapshot in fleet/.snapshots/<TS>.json; rollback deletes only that batch.
#  * Preflight blocks on: duplicate names, live duplicates, unresolved/cyclic
#    reports_to, missing persona files, malformed capabilities first line.
#
# To activate a deferred role: set its `apply: now`, commit the persona file,
# then run `python fleet/apply.py --dry-run` followed by `--apply`.
# ─────────────────────────────────────────────────────────────────────────────
