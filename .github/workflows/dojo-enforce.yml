name: Dojo Enforcement

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (spec + plan + actions audit)
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per .github/known-pitfalls.md "DO NOT use floating uses: versions".
      # Update SHAs deliberately; the comment after # is the human-readable version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run dojo verification gate (CI mode)
        run: bash scripts/verify.sh --check

  enforce-action-pinning:
    name: Enforce GitHub Action SHA pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Reject unpinned uses: in any workflow
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r wf; do
            violations=$(grep -nE '^\s*-?\s*uses:\s*[^@]+@[^[:space:]]+' "$wf" \
                         | grep -vE '@[0-9a-f]{40}\b' || true)
            if [ -n "$violations" ]; then
              echo "::error file=$wf::Unpinned uses: detected. Pin to a 40-char commit SHA + version comment."
              echo "$violations"
              bad=1
            fi
          done < <(find .github/workflows -name '*.yml' -o -name '*.yaml')
          exit $bad

