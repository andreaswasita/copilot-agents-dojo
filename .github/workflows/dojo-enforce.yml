name: Dojo Enforcement

# Triggers
#   - pull_request:    primary gate, runs on every PR targeting main
#   - push (main):     safety net for direct admin pushes (branch protection
#                      normally blocks these, but this catches any bypass)
#   - workflow_dispatch: manual trigger for debugging the gate itself
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: jobs only read the repo. None of these modify state.
permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Required (must pass to merge) ------------------------------------------

  actions-audit:
    name: Action SHA-pinning
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per .github/known-pitfalls.md "DO NOT use floating uses:".
      # Update SHA deliberately; comment after # is the human-readable version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh actions
        run: bash scripts/verify.sh actions

  traceability-gate:
    name: Red-Thread traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh traceability
        run: bash scripts/verify.sh traceability

  traceability-tests:
    # Pytest harness for scripts/verify-traceability.sh — exercises 27
    # fixture engagements in tmp_path against the real script via
    # subprocess. Promoted to required check after PRs #20 and #22
    # both ran it green.
    name: Traceability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install -r tests/requirements-dev.txt
      - name: Run pytest
        run: pytest -q tests/

  installer-tests:
    # Vitest suite for control-plane/packages/installer — the npx
    # copilot-dojo bootstrap CLI. Hermetic; uses a local fixture tarball
    # via DOJO_TARBALL_URL so no network is required.
    # Required check on main after two green runs (PRs #22 and #23).
    name: Installer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: '11'
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm --filter copilot-dojo build
      - name: Run installer tests
        run: pnpm --filter copilot-dojo test

  mcp-memory-tests:
    # Vitest suite for control-plane/packages/mcp-memory — the MCP server
    # that exposes the dojo memory vault. Hermetic; uses os.tmpdir() vaults.
    # Required check on main after green runs on PRs #27 and #28.
    name: MCP memory tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: '11'
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build mcp-memory
        run: pnpm --filter @dojo/mcp-memory build
      - name: Run mcp-memory tests
        run: pnpm --filter @dojo/mcp-memory test

  spec-invariants:
    # Promoted to required in branch protection after PR #16 cleared the 20
    # pre-existing failures + 5 warnings (tracked in Roadmap Theme 5.3).
    name: Spec invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh spec --check
        run: bash scripts/verify.sh spec --check

  # --- Required ---------------------------------------------------------------

  plan-check:
    # tasks/todo.md sanity. verify.sh runs in canonical-repo mode here,
    # asserting the scaffold template is intact (see scripts/verify.sh
    # run_plan_checks + AGENTS.md → Task Plan Policy).
    name: Plan sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh plan
        run: bash scripts/verify.sh plan
