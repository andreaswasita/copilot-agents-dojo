name: Dojo Enforcement

# Triggers
#   - pull_request:    primary gate, runs on every PR targeting main
#   - push (main):     safety net for direct admin pushes (branch protection
#                      normally blocks these, but this catches any bypass)
#   - workflow_dispatch: manual trigger for debugging the gate itself
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: jobs only read the repo. None of these modify state.
permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Required (must pass to merge) ------------------------------------------

  actions-audit:
    name: Action SHA-pinning
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per .github/known-pitfalls.md "DO NOT use floating uses:".
      # Update SHA deliberately; comment after # is the human-readable version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh actions
        run: bash scripts/verify.sh actions

  traceability-gate:
    name: Red-Thread traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh traceability
        run: bash scripts/verify.sh traceability

  traceability-tests:
    # Pytest harness for scripts/verify-traceability.sh — exercises 27
    # fixture engagements in tmp_path against the real script via
    # subprocess. Informational until we trust it across PR shapes;
    # promote to required via branch protection once stable.
    name: Traceability tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install -r tests/requirements-dev.txt
      - name: Run pytest
        run: pytest -q tests/

  spec-invariants:
    # Promoted to required in branch protection after PR #16 cleared the 20
    # pre-existing failures + 5 warnings (tracked in Roadmap Theme 5.3).
    name: Spec invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh spec --check
        run: bash scripts/verify.sh spec --check

  # --- Informational ----------------------------------------------------------

  plan-check:
    # Tasks/todo.md is a per-clone artifact, not always present in PR diffs.
    # Keep advisory so it doesn't block infra-only PRs.
    name: Plan sanity (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run verify.sh plan
        run: bash scripts/verify.sh plan
