<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Agents Dojo 🏯</title>
<meta name="description" content="A discipline framework for your GitHub Copilot agents. Train your agents — earn your belt.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0d1117;--ink2:#161b22;--blue:#1f6feb;--green:#3fb950;--amber:#f59e0b;--violet:#8b5cf6;--teal:#14b8a6;--text:#e6edf3;--muted:#9aa7b4;--border:#2b3340}
  html,body{height:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100%;
    display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center;
    background:radial-gradient(1100px 560px at 80% -10%,rgba(31,111,235,.12),transparent 60%),radial-gradient(900px 480px at 10% 110%,rgba(245,158,11,.10),transparent 60%),var(--ink)}
  .wrap{max-width:680px}
  .mark{font-size:64px;line-height:1;filter:drop-shadow(0 0 18px rgba(245,158,11,.4))}
  h1{font-size:34px;font-weight:800;margin:18px 0 6px;letter-spacing:.3px}
  h1 span{color:var(--blue)}
  .jp{color:var(--amber);letter-spacing:6px;font-size:15px;margin-bottom:14px}
  p.lead{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:30px}
  .belts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
  .belt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--ink2)}
  .belt .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--amber);color:#1b1300;font-weight:800;font-size:16px;
    padding:14px 28px;border-radius:12px;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 28px rgba(245,158,11,.25)}
  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(245,158,11,.35)}
  .links{margin-top:26px;font-size:14px}
  .links a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:1px}
  .links a:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">🏯</div>
    <h1><span>Copilot Agents</span> Dojo</h1>
    <div class="jp">道 場</div>
    <p class="lead">A discipline framework for your GitHub Copilot agents.<br>Train your agents — earn your belt through the mandatory workflow.</p>
    <div class="belts">
      <span class="belt"><span class="sw" style="background:#e6edf3"></span>⚪ 白帯 White</span>
      <span class="belt"><span class="sw" style="background:#1f6feb"></span>🔵 青帯 Blue</span>
      <span class="belt"><span class="sw" style="background:#a16838"></span>🟤 茶帯 Brown</span>
      <span class="belt"><span class="sw" style="background:#f59e0b"></span>⚫ 黒帯 Black</span>
    </div>
    <a class="cta" href="./quests/">🥋 Enter the Belt Quest →</a>
    <div class="links">
      <a href="https://github.com/andreaswasita/copilot-agents-dojo" target="_blank" rel="noopener">View the Dojo on GitHub ↗</a>
    </div>
  </div>
</body>
</html>
