<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Agents Dojo 🏯 — Belt Quest</title>
<meta name="description" content="Train your GitHub Copilot agents. Earn your belt — 白帯 White to 黒帯 Black — through the Dojo's mandatory workflow.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#0d1117;--ink2:#161b22;--panel:#161b22;--panel2:#1c2230;
    --blue:#1f6feb;--green:#3fb950;--amber:#f59e0b;--violet:#8b5cf6;--teal:#14b8a6;
    --text:#e6edf3;--text-muted:#9aa7b4;--border:#2b3340;
    --white-belt:#e6edf3;--blue-belt:#1f6feb;--brown-belt:#a16838;--black-belt:#0b0e14;
    --panel-w:480px;--top-bar:54px;
  }
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(31,111,235,.10),transparent 60%),
      radial-gradient(900px 500px at 10% 110%,rgba(245,158,11,.08),transparent 60%),
      var(--ink);
  }
  /* faint shoji-grid texture */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:44px 44px}

  .top-bar{position:fixed;top:0;left:0;right:0;height:var(--top-bar);background:rgba(13,17,23,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:100}
  .top-bar .title{font-size:15px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
  .top-bar .title .mark{font-weight:400}
  .top-bar .title span{color:var(--blue)}
  .belt-pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;
    border:1px solid var(--border);background:var(--ink2);white-space:nowrap}
  .belt-pill .swatch{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
  .progress-wrap{flex:1;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .progress-track{flex:1;height:9px;background:var(--ink2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .progress-fill{height:100%;width:0;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1),background .6s}
  .progress-label{font-size:12.5px;color:var(--text-muted);min-width:84px;text-align:right}
  .btn-reset{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:7px;
    cursor:pointer;font-size:12px;white-space:nowrap;transition:all .2s}
  .btn-reset:hover{border-color:var(--amber);color:var(--amber)}

  .phase-label{position:absolute;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--text-muted);opacity:.6;pointer-events:none;z-index:3}
  .phase-label .kanji{display:block;font-size:22px;letter-spacing:6px;opacity:.9;margin-bottom:2px}
  .phase-label .en{font-size:12px}
  .phase-label .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;border:1px solid rgba(255,255,255,.3)}
  .phase-label.p1{top:74px;left:1.6%}.phase-label.p2{top:74px;left:27%}.phase-label.p3{top:74px;left:52%}.phase-label.p4{top:74px;left:77.5%}
  .phase-divider{position:absolute;top:var(--top-bar);bottom:0;width:1px;
    background:linear-gradient(to bottom,transparent,var(--border) 14%,var(--border) 86%,transparent);opacity:.7;pointer-events:none}
  .phase-divider.d1{left:25.5%}.phase-divider.d2{left:50.5%}.phase-divider.d3{left:75.5%}

  .quest-map{position:fixed;top:var(--top-bar);left:0;right:0;bottom:0;overflow:hidden;z-index:1}
  .quest-map svg.path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .torii{position:absolute;right:2.2%;top:50%;transform:translateY(-50%);opacity:.16;pointer-events:none;z-index:1;color:var(--amber);filter:drop-shadow(0 0 14px rgba(245,158,11,.4))}
  .torii .dojo-ico{width:172px;height:172px;stroke-width:.85}
  /* hand-drawn icon sizing */
  .dojo-ico{width:28px;height:28px;display:block;color:var(--text)}
  .node .inner{color:var(--text)}
  .node.active .inner .dojo-ico{color:#bcd4ff}
  .node.complete.belt1 .inner .dojo-ico,.node.complete.belt2 .inner .dojo-ico,.node.complete.belt3 .inner .dojo-ico,.node.complete.belt4 .inner .dojo-ico{color:var(--green)}
  .emoji-big .dojo-ico{width:34px;height:34px}
  .m-node .dojo-ico{width:26px;height:26px}
  .m-item.active .m-node .dojo-ico{color:#bcd4ff}
  .m-check-done{color:var(--green);font-size:22px;font-weight:700}
  .belt-emoji .dojo-ico{width:56px;height:56px;display:inline-block;stroke-width:1.5}

  .node{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);z-index:10;transform:translate(-50%,-50%)}
  .node .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--border);transition:all .35s}
  .node .inner{width:100%;height:100%;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;
    font-size:23px;position:relative;z-index:1;transition:all .35s;border:2px solid var(--border)}
  .node .lock{position:absolute;font-size:14px;opacity:.8}
  .node.active .ring{border-color:var(--blue);box-shadow:0 0 22px rgba(31,111,235,.45);animation:pulse-ring 2s infinite}
  .node.active .inner{border-color:var(--blue);background:rgba(31,111,235,.16);transform:scale(1.1)}
  .node.active .lock{display:none}
  .node.complete .ring{border-color:var(--green);box-shadow:0 0 14px rgba(63,185,80,.3)}
  .node.complete .inner{border-color:var(--green);background:rgba(63,185,80,.18)}
  .node.complete .lock{display:none}
  .node.locked{cursor:not-allowed}
  .node.locked .inner{opacity:.45;filter:grayscale(.4)}
  .node:not(.locked):hover{transform:translate(-50%,-50%) scale(1.12)}
  .node .label{position:absolute;top:calc(100% + 11px);white-space:nowrap;font-size:11px;font-weight:600;color:var(--text-muted);
    text-align:center;pointer-events:none;transition:color .3s;max-width:130px;left:50%;transform:translateX(-50%);line-height:1.25}
  .node.active .label{color:var(--blue)}.node.complete .label{color:var(--green)}
  .check-icon{display:none;color:var(--green)}.node.complete .check-icon{display:block}.node.complete .emoji{display:none}
  @keyframes pulse-ring{0%,100%{box-shadow:0 0 20px rgba(31,111,235,.3)}50%{box-shadow:0 0 34px rgba(31,111,235,.6)}}

  /* belt-tinted node rings per phase when complete */
  .node.complete.belt1 .inner{border-color:var(--white-belt)}
  .node.complete.belt2 .inner{border-color:var(--blue-belt)}
  .node.complete.belt3 .inner{border-color:var(--brown-belt)}
  .node.complete.belt4 .inner{border-color:var(--amber)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
  .overlay.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);max-width:94vw;background:var(--panel);
    border-left:1px solid var(--border);z-index:210;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
  .panel.open{transform:translateX(0)}
  .panel-belt-bar{height:5px;width:100%;background:var(--border)}
  .panel-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:13px}
  .panel-header .emoji-big{font-size:34px;line-height:1}
  .panel-header .meta{flex:1}
  .panel-header .meta .kicker{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
  .panel-header .meta h2{font-size:19px;font-weight:800;margin-bottom:4px}
  .panel-header .meta .time{font-size:12px;color:var(--text-muted)}
  .panel-close{background:none;border:none;color:var(--text-muted);font-size:23px;cursor:pointer;padding:2px 4px;line-height:1}
  .panel-close:hover{color:var(--text)}
  .panel-body{flex:1;padding:20px 24px 30px;display:flex;flex-direction:column;gap:16px}
  .panel-body .desc{font-size:14px;line-height:1.6;color:var(--text)}
  .panel-body .desc code{background:var(--ink2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12.5px;font-family:'Cascadia Code','Fira Code',monospace}
  .panel-body .desc strong{color:#fff}
  .panel-body a{color:var(--blue)}

  .copy-group{display:flex;flex-direction:column;gap:10px}
  .copy-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
  .copy-block{position:relative;background:var(--ink2);border:1px solid var(--border);border-radius:9px;padding:12px 46px 12px 14px;
    font-family:'Cascadia Code','Fira Code',monospace;font-size:12.5px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .copy-btn{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text-muted);
    width:30px;height:30px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .copy-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
  .copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}

  .substeps{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .substeps li{font-size:13px;color:var(--text-muted);padding-left:20px;position:relative;line-height:1.5}
  .substeps li::before{content:'';position:absolute;left:2px;top:7px;width:8px;height:8px;border-radius:50%;border:2px solid var(--teal)}

  .toggle-done{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:10px;border:2px solid var(--border);
    background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:var(--text);transition:all .25s;width:100%;text-align:left}
  .toggle-done .dot{width:23px;height:23px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
    transition:all .25s;flex-shrink:0;font-size:13px}
  .toggle-done:hover{border-color:var(--green)}
  .toggle-done.checked{border-color:var(--green);background:rgba(63,185,80,.1)}
  .toggle-done.checked .dot{background:var(--green);border-color:var(--green);color:#fff}

  .stuck-toggle{background:none;border:none;color:var(--amber);font-size:13px;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:6px;font-weight:600}
  .stuck-toggle:hover{text-decoration:underline}
  .stuck-content{max-height:0;overflow:hidden;transition:max-height .35s;font-size:13px;color:var(--text-muted);line-height:1.65}
  .stuck-content.open{max-height:600px}
  .stuck-content p{margin-top:9px}

  .skill-card{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:11px;text-decoration:none;
    background:linear-gradient(135deg,rgba(139,92,246,.13),rgba(31,111,235,.13));border:1px solid rgba(139,92,246,.32);transition:all .2s}
  .skill-card:hover{border-color:rgba(139,92,246,.6);transform:translateY(-1px);box-shadow:0 6px 18px rgba(139,92,246,.18)}
  .skill-card .ico{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--blue));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .skill-card .info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .skill-card .info .l{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
  .skill-card .info .n{font-size:14px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .skill-card .arrow{margin-left:auto;color:var(--text-muted);font-size:17px}

  /* celebration */
  .confetti{position:fixed;width:10px;height:16px;pointer-events:none;z-index:999;border-radius:2px}
  .banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(22,27,34,.98);
    border:2px solid var(--amber);border-radius:18px;padding:34px 56px;text-align:center;z-index:1000;
    transition:transform .55s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 20px 70px rgba(0,0,0,.6);max-width:90vw}
  .banner.show{transform:translate(-50%,-50%) scale(1)}
  .banner .belt-emoji{font-size:46px;margin-bottom:8px}
  .banner h1{font-size:26px;margin-bottom:6px}
  .banner .jp{font-size:15px;color:var(--amber);letter-spacing:4px;margin-bottom:10px}
  .banner p{color:var(--text-muted);font-size:14.5px;line-height:1.5}
  .banner .cert-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .banner button.cta{background:var(--amber);border:none;color:#1b1300;font-weight:700;padding:10px 18px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .banner button.cta.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .banner canvas{max-width:340px;width:100%;border-radius:10px;border:1px solid var(--border);margin-top:6px}

  .credit{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);opacity:.6;pointer-events:none;letter-spacing:.3px;z-index:5;text-align:center}
  .credit a{color:var(--text-muted);pointer-events:auto}

  .panel::-webkit-scrollbar{width:7px}.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  #mobileList{display:none}
  @media(max-width:820px){
    html,body{overflow:auto;height:auto}
    :root{--top-bar:50px}
    body::before{display:none}
    .top-bar{padding:0 12px;gap:8px}
    .top-bar .title{font-size:12.5px}
    .belt-pill{display:none}
    .progress-wrap{max-width:none;gap:7px}
    .progress-label{min-width:62px;font-size:11.5px}
    .btn-reset{padding:5px 9px;font-size:11px}
    .quest-map,.phase-label,.phase-divider,.path-svg,.torii{display:none!important}
    #mobileList{display:flex;flex-direction:column;padding:62px 16px 90px;gap:0}
    .m-phase-header{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:22px 0 12px}
    .m-phase-header:first-child{padding-top:4px}
    .m-phase-header .kanji{font-size:18px;letter-spacing:3px;color:var(--text)}
    .m-phase-header .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.3)}
    .m-item{display:flex;align-items:center;gap:14px;padding:13px 0;position:relative;cursor:pointer}
    .m-item::before{content:'';position:absolute;left:25px;top:0;bottom:0;width:2px;background:var(--border);z-index:0}
    .m-item:last-child::before{bottom:50%}
    .m-node{width:50px;height:50px;border-radius:50%;background:var(--panel2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;position:relative;z-index:1;transition:all .3s}
    .m-item.complete .m-node{border-color:var(--green);background:rgba(63,185,80,.18)}
    .m-item.active .m-node{border-color:var(--blue);background:rgba(31,111,235,.16);box-shadow:0 0 12px rgba(31,111,235,.35)}
    .m-item.locked .m-node{opacity:.45}
    .m-text{flex:1;min-width:0}
    .m-text .m-title{font-size:15px;font-weight:700;color:var(--text)}
    .m-item.complete .m-title{color:var(--green)}
    .m-item.active .m-title{color:var(--blue)}
    .m-item.locked .m-title{color:var(--text-muted)}
    .m-text .m-time{font-size:12px;color:var(--text-muted)}
    .m-check{color:var(--green);font-size:18px;flex-shrink:0;opacity:0;transition:opacity .3s}
    .m-item.complete .m-check{opacity:1}
    .panel{width:100%;max-width:100%;border-left:none;border-radius:18px 18px 0 0;top:auto;bottom:0;max-height:88vh;transform:translateY(100%)}
    .panel.open{transform:translateY(0)}
    .banner{padding:24px 26px}.banner h1{font-size:21px}
    .credit{position:relative;transform:none;left:0;padding:20px 0}
  }
</style>
</head>
<body>
<div class="top-bar">
  <div class="title"><span>Copilot Agents Dojo</span> <span class="mark">🏯</span> — Belt Quest</div>
  <div class="belt-pill" id="beltPill"><span class="swatch" id="beltSwatch"></span><span id="beltName">白帯 White Belt</span></div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>
  <button class="btn-reset" onclick="resetProgress()">Reset</button>
</div>

<div class="quest-map" id="questMap">
  <svg class="path-svg" id="pathSvg" preserveAspectRatio="none"></svg>
  <div class="torii" id="toriiBg"></div>
</div>
<div id="mobileList"></div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-belt-bar" id="panelBeltBar"></div>
  <div class="panel-header">
    <div class="emoji-big" id="panelEmoji"></div>
    <div class="meta"><div class="kicker" id="panelKicker"></div><h2 id="panelTitle"></h2><div class="time" id="panelTime"></div></div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="banner" id="banner"></div>

<div class="credit">
  Copilot Agents Dojo — Belt Quest ·
  <a href="https://github.com/andreaswasita/copilot-agents-dojo" target="_blank" rel="noopener">github.com/andreaswasita/copilot-agents-dojo</a>
</div>

<script>
/* ───────────────── Hand-drawn Japanese icon set (inline SVG) ─────────────────
   Original line-art, 24×24, stroke=currentColor — license-free & self-contained. */
function svgIco(inner){
  return `<svg class="dojo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}
const ICONS = {
  dojo:    svgIco(`<path d="M3 10.2c2.6-1.4 5.6-2.1 9-2.1s6.4.7 9 2.1"/><path d="M12 5 4.5 9.6h15L12 5Z"/><path d="M6 10.5V19M18 10.5V19"/><path d="M9.5 19v-3.5a2.5 2.5 0 0 1 5 0V19"/><path d="M4 19.2h16"/>`),
  clipboard:svgIco(`<rect x="5.5" y="4.5" width="13" height="16" rx="2"/><path d="M9 4.5V3.8a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v.7"/><path d="M8.5 11.5l2 2 4-4"/><path d="M8.5 16.5h7"/>`),
  sprout:  svgIco(`<path d="M12 21v-7.5"/><path d="M12 13.5c0-3.3 2.2-5.5 6.5-5.5 0 3.3-2.2 5.5-6.5 5.5Z"/><path d="M12 15c0-2.7-2-4.8-5.5-4.8 0 2.7 2 4.8 5.5 4.8Z"/><path d="M7 21h10"/>`),
  belt:    svgIco(`<path d="M2.5 10.5h7.5"/><path d="M14 10.5h7.5"/><rect x="9.5" y="8.7" width="5" height="3.6" rx="0.6"/><path d="M10.8 12.3 9 17.5"/><path d="M13.2 12.3 15 17.5"/>`),
  map:     svgIco(`<path d="M9 4.2 4 6.2v13.6l5-2 6 2 5-2V4.2l-5 2-6-2Z"/><path d="M9 4.2v13.6"/><path d="M15 6.2v13.6"/>`),
  enso:    svgIco(`<path d="M16.8 6A8 8 0 1 0 19.3 11.6"/><path d="M19.3 11.6 21 9.4M19.3 11.6l-2.2.3"/>`),
  brush:   svgIco(`<path d="M20.5 4.5 12.5 12.5"/><path d="M12.8 12.2c-1.7-1.7-4.3-1.2-5.4 1-1 2.2-3.4 2.3-3.4 2.3s.1-2.5 1.2-4.7c1.1-2.2 4.4-2.4 6.1-.7Z"/>`),

/* ───────────────────────── State ───────────────────────── */
const STORE_KEY="dojo-belt-quest-v1";
let done = loadState();
const total = CHECKPOINTS.length;

function loadState(){
  try{
    const v=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");
    return (v && typeof v==="object" && !Array.isArray(v)) ? v : {};
  }catch(e){ return {}; }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(done)); }catch(e){} }

function isComplete(id){ return !!done[id]; }
function indexOf(id){ return CHECKPOINTS.findIndex(c=>c.id===id); }
function isUnlocked(i){ if(i===0) return true; return isComplete(CHECKPOINTS[i-1].id); }
function completedCount(){ return CHECKPOINTS.filter(c=>isComplete(c.id)).length; }

function currentBelt(){
  // Completion is a contiguous prefix, so the belt you're training in is the
  // phase of the first incomplete checkpoint (or Black if all are done).
  const firstIncomplete=CHECKPOINTS.find(c=>!isComplete(c.id));
  return firstIncomplete?firstIncomplete.phase:4;
}

/* ───────────────────────── Layout (desktop serpentine path) ─────────── */
function nodePositions(){
  // Distribute nodes within their phase column; serpentine vertically.
  const byPhase={1:[],2:[],3:[],4:[]};
  CHECKPOINTS.forEach((c,i)=>byPhase[c.phase].push({c,i}));
  const colCenters={1:13.5,2:38,3:63,4:88}; // % of width
  const pos={};
  Object.keys(byPhase).forEach(p=>{
    const arr=byPhase[p];
    const n=arr.length;
    const topPad=24, botPad=16; // % of map height
    arr.forEach((o,k)=>{
      const t = n===1?0.5:(k/(n-1));
      const y = topPad + t*(100-topPad-botPad);
      // gentle horizontal wave around the column center
      const wave = Math.sin(k*1.15 + (+p))*4.2;
      pos[o.c.id]={x:colCenters[p]+wave, y, idx:o.i};
    });
  });
  return pos;
}

/* ───────────────────────── Render: desktop map ───────────────────────── */
function renderMap(){
  const map=document.getElementById("questMap");
  // clear old nodes (keep svg + torii)
  map.querySelectorAll(".node,.phase-label,.phase-divider").forEach(e=>e.remove());
  document.querySelectorAll(".phase-label,.phase-divider").forEach(e=>e.remove());

  // phase labels + dividers
  for(let p=1;p<=4;p++){
    const b=BELTS[p];
    const lab=document.createElement("div");
    lab.className="phase-label p"+p;
    lab.innerHTML=`<span class="kanji">${b.kanji}</span><span class="en"><span class="swatch" style="background:${b.color}"></span>${b.emoji} ${b.en} · ${b.label}</span>`;
    document.body.appendChild(lab);
  }
  ["d1","d2","d3"].forEach(d=>{const el=document.createElement("div");el.className="phase-divider "+d;document.body.appendChild(el);});

  const pos=nodePositions();
  const rect=map.getBoundingClientRect();

  // draw serpentine path through nodes in order
  const svg=document.getElementById("pathSvg");
  svg.setAttribute("viewBox",`0 0 ${rect.width} ${rect.height}`);
  let d="";
  CHECKPOINTS.forEach((c,i)=>{
    const x=pos[c.id].x/100*rect.width;
    const y=pos[c.id].y/100*rect.height;
    if(i===0){ d=`M ${x} ${y}`; }
    else{
      const px=pos[CHECKPOINTS[i-1].id].x/100*rect.width;
      const py=pos[CHECKPOINTS[i-1].id].y/100*rect.height;
      const mx=(px+x)/2;
      d+=` C ${mx} ${py}, ${mx} ${y}, ${x} ${y}`;
    }
  });
  const completedFrac=completedCount()/total;
  svg.innerHTML=`
    <defs>
      <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#e6edf3"/><stop offset="33%" stop-color="#1f6feb"/>
        <stop offset="66%" stop-color="#a16838"/><stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>
    <path d="${d}" fill="none" stroke="#2b3340" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"
          pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-completedFrac}" style="transition:stroke-dashoffset .6s"/>
  `;

  // nodes
  CHECKPOINTS.forEach((c,i)=>{
    const node=document.createElement("div");
    const state=isComplete(c.id)?"complete":(isUnlocked(i)?"active":"locked");
    node.className=`node belt${c.phase} ${state}`;
    node.style.left=pos[c.id].x+"%";
    node.style.top=pos[c.id].y+"%";
    node.innerHTML=`
      <div class="ring"></div>
      <div class="inner">
        <span class="emoji">${iconFor(c.id)}</span>
        <span class="check-icon">✓</span>
        ${state==="locked"?'<span class="lock">🔒</span>':''}
      </div>
      <div class="label">${c.title}</div>`;
    node.onclick=()=>{ if(state==="locked"){ shake(node); return; } openPanel(c.id); };
    map.appendChild(node);
  });
}

function shake(el){ el.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(calc(-50% - 5px),-50%)'},{transform:'translate(calc(-50% + 5px),-50%)'},{transform:'translate(-50%,-50%)'}],{duration:260}); }

/* ───────────────────────── Render: mobile list ───────────────────────── */
function renderMobile(){
  const list=document.getElementById("mobileList");
  list.innerHTML="";
  let lastPhase=0;
  CHECKPOINTS.forEach((c,i)=>{
    if(c.phase!==lastPhase){
      lastPhase=c.phase;
      const b=BELTS[c.phase];
      const h=document.createElement("div");
      h.className="m-phase-header";
      h.innerHTML=`<span class="sw" style="background:${b.color}"></span><span class="kanji">${b.kanji}</span> ${b.emoji} ${b.en} — ${b.label}`;
      list.appendChild(h);
    }
    const state=isComplete(c.id)?"complete":(isUnlocked(i)?"active":"locked");
    const item=document.createElement("div");
    item.className="m-item "+state;
    item.innerHTML=`
      <div class="m-node">${isComplete(c.id)?'<span class="m-check-done">✓</span>':iconFor(c.id)}</div>
      <div class="m-text"><div class="m-title">${c.title}</div><div class="m-time">${c.time}</div></div>
      <div class="m-check">✓</div>`;
    item.onclick=()=>{ if(state==="locked") return; openPanel(c.id); };
    list.appendChild(item);
  });
}

/* ───────────────────────── Progress + belt pill ───────────────────────── */
function updateProgress(){
  const c=completedCount();
  const fill=document.getElementById("progressFill");
  fill.style.width=(c/total*100)+"%";
  const belt=currentBelt();
  fill.style.background=`linear-gradient(90deg,#e6edf3,${BELTS[belt].color})`;
  document.getElementById("progressLabel").textContent=`${c} / ${total}`;
  const b=BELTS[belt];
  document.getElementById("beltName").textContent=`${b.kanji} ${b.en}`;
  document.getElementById("beltSwatch").style.background=b.color;
}

/* ───────────────────────── Panel ───────────────────────── */
let activeId=null;
function openPanel(id){
  const c=CHECKPOINTS.find(x=>x.id===id); if(!c) return;
  activeId=id;
  const b=BELTS[c.phase];
  document.getElementById("panelBeltBar").style.background=b.color;
  document.getElementById("panelEmoji").innerHTML=iconFor(c.id);
  document.getElementById("panelKicker").innerHTML=`<span style="color:${b.color}">${b.kanji} ${b.en}</span> · ${b.label}`;
  document.getElementById("panelTitle").textContent=c.title;
  document.getElementById("panelTime").textContent="⏱ "+c.time;

  const body=document.getElementById("panelBody");
  body.innerHTML="";

  const desc=document.createElement("div"); desc.className="desc"; desc.innerHTML=c.desc; body.appendChild(desc);

  if(c.copies&&c.copies.length){
    const g=document.createElement("div"); g.className="copy-group";
    c.copies.forEach(cp=>{
      const wrap=document.createElement("div");
      wrap.innerHTML=`<div class="copy-label">${cp.label}</div>`;
      const block=document.createElement("div"); block.className="copy-block"; block.textContent=cp.text;
      const btn=document.createElement("button"); btn.className="copy-btn"; btn.title="Copy"; btn.innerHTML="⧉";
      btn.onclick=()=>copyText(cp.text,btn);
      block.appendChild(btn); wrap.appendChild(block); g.appendChild(wrap);
    });
    body.appendChild(g);
  }

  [c.skill,c.skill2].forEach(s=>{ if(!s) return;
    const a=document.createElement("a"); a.className="skill-card"; a.href=s.href; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<div class="ico">🥋</div><div class="info"><div class="l">${s.label}</div><div class="n">${s.name}</div></div><div class="arrow">↗</div>`;
    body.appendChild(a);
  });

  if(c.stuck){
    const st=document.createElement("button"); st.className="stuck-toggle"; st.innerHTML="🤔 Stuck? Show a hint";
    const sc=document.createElement("div"); sc.className="stuck-content"; sc.innerHTML=`<p>${c.stuck}</p>`;
    st.onclick=()=>{ sc.classList.toggle("open"); st.innerHTML=sc.classList.contains("open")?"🤔 Hide hint":"🤔 Stuck? Show a hint"; };
    body.appendChild(st); body.appendChild(sc);
  }

  const tog=document.createElement("button");
  tog.className="toggle-done"+(isComplete(id)?" checked":"");
  tog.innerHTML=`<span class="dot">${isComplete(id)?'✓':''}</span><span>${c.toggle}</span>`;
  tog.onclick=()=>toggleDone(id,tog);
  body.appendChild(tog);

  if(c.learn){
    const learn=document.createElement("div");
    learn.style.cssText="font-size:12.5px;color:var(--text-muted);border-left:3px solid var(--teal);padding:8px 12px;background:var(--ink2);border-radius:0 8px 8px 0;line-height:1.5";
    learn.innerHTML=`<strong style="color:var(--teal)">帯 Belt wisdom:</strong> ${c.learn}`;
    body.appendChild(learn);
  }

  document.getElementById("overlay").classList.add("open");
  document.getElementById("panel").classList.add("open");
}
function closePanel(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("panel").classList.remove("open");
  activeId=null;
}

function copyText(text,btn){
  const ok=()=>{ btn.classList.add("copied"); btn.innerHTML="✓"; setTimeout(()=>{btn.classList.remove("copied");btn.innerHTML="⧉";},1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text,ok)); }
  else fallbackCopy(text,ok);
}
function fallbackCopy(text,ok){ const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(ta); }

/* ───────────────────────── Completion logic ───────────────────────── */
function toggleDone(id,tog){
  const wasComplete=isComplete(id);
  const c=CHECKPOINTS.find(x=>x.id===id);
  const i=indexOf(id);
  const phaseBefore=phaseComplete(c.phase);
  if(wasComplete){
    // Keep completion a contiguous prefix: clearing one clears everything after it.
    for(let k=i;k<CHECKPOINTS.length;k++){ delete done[CHECKPOINTS[k].id]; }
  } else {
    done[id]=Date.now();
  }
  saveState();
  tog.classList.toggle("checked",!wasComplete);
  tog.querySelector(".dot").textContent=!wasComplete?'✓':'';
  renderAll();

  if(!wasComplete){
    burstConfetti();
    const phaseAfter=phaseComplete(c.phase);
    if(!phaseBefore && phaseAfter){
      if(c.phase===4 && completedCount()===total) showBlackBelt();
      else showBeltPromotion(c.phase);
    }
  }
}
function phaseComplete(p){ return CHECKPOINTS.filter(c=>c.phase===p).every(c=>isComplete(c.id)); }

function renderAll(){ renderMap(); renderMobile(); updateProgress(); }

/* ───────────────────────── Celebration ───────────────────────── */
function burstConfetti(){
  const colors=["#e6edf3","#1f6feb","#a16838","#f59e0b","#3fb950","#8b5cf6","#14b8a6"];
  for(let i=0;i<70;i++){
    const el=document.createElement("div"); el.className="confetti";
    el.style.background=colors[i%colors.length];
    el.style.left=(45+Math.random()*10)+"vw"; el.style.top="50vh";
    document.body.appendChild(el);
    const ang=Math.random()*Math.PI*2, dist=120+Math.random()*340;
    el.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+260}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:1100+Math.random()*900,easing:"cubic-bezier(.2,.6,.3,1)"}).onfinish=()=>el.remove();
  }
}

function showBeltPromotion(phase){
  const next=BELTS[phase+1]||BELTS[4];
  const earned=BELTS[phase];
  const banner=document.getElementById("banner");
  banner.innerHTML=`
    <div class="belt-emoji" style="color:${earned.color}">${ICONS.belt}</div>
    <div class="jp">${earned.kanji} 昇級</div>
    <h1>${earned.en} earned!</h1>
    <p>You've mastered <strong>${earned.label}</strong>.<br>Next: <strong>${next.kanji} ${next.en}</strong> — ${next.label}.</p>
    <div class="cert-actions"><button class="cta" onclick="hideBanner()">続ける · Continue</button></div>`;
  showBanner();
}

function showBlackBelt(){
  const banner=document.getElementById("banner");
  banner.innerHTML=`
    <div class="belt-emoji" style="color:var(--amber)">${ICONS.daruma}</div>
    <div class="jp">黒帯 — 免許皆伝</div>
    <h1>Black Belt — Dojo Master!</h1>
    <p>You've walked the full path: install → core kata → the mandatory workflow → mastery.<br>Your Copilot agents now build with discipline. 🏯</p>
    <canvas id="certCanvas" width="640" height="360"></canvas>
    <div class="cert-actions">
      <button class="cta" onclick="downloadCert()">⬇ Download certificate</button>
      <button class="cta ghost" onclick="hideBanner()">閉じる · Close</button>
    </div>`;
  showBanner();
  drawCert();
}
function showBanner(){ const b=document.getElementById("banner"); b.classList.add("show"); }
function hideBanner(){ document.getElementById("banner").classList.remove("show"); }

function drawCert(){
  const cv=document.getElementById("certCanvas"); if(!cv) return;
  const x=cv.getContext("2d"), W=cv.width, H=cv.height;
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#0d1117"); g.addColorStop(1,"#161b22");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle="#f59e0b"; x.lineWidth=4; x.strokeRect(16,16,W-32,H-32);
  x.strokeStyle="#2b3340"; x.lineWidth=1; x.strokeRect(26,26,W-52,H-52);
  x.textAlign="center";
  x.fillStyle="#f59e0b"; x.font="600 26px 'Segoe UI',sans-serif"; x.fillText("黒帯 · 免許皆伝", W/2, 84);
  x.fillStyle="#e6edf3"; x.font="700 30px 'Segoe UI',sans-serif"; x.fillText("Copilot Agents Dojo", W/2, 140);
  x.font="400 16px 'Segoe UI',sans-serif"; x.fillStyle="#9aa7b4"; x.fillText("certifies the bearer has earned the rank of", W/2, 174);
  x.fillStyle="#fff"; x.font="800 38px 'Segoe UI',sans-serif"; x.fillText("BLACK BELT 🥋", W/2, 222);
  x.fillStyle="#9aa7b4"; x.font="400 14px 'Segoe UI',sans-serif";
  x.fillText("Install · Core Kata · Mandatory Workflow · Mastery", W/2, 262);
  x.fillStyle="#3fb950"; x.font="600 15px 'Segoe UI',sans-serif";
  x.fillText("All "+total+" checkpoints complete", W/2, 296);
  x.fillStyle="#57606a"; x.font="400 12px 'Segoe UI',sans-serif";
  x.fillText(new Date().toISOString().slice(0,10)+"  ·  github.com/andreaswasita/copilot-agents-dojo", W/2, 326);
}
function downloadCert(){
  const cv=document.getElementById("certCanvas"); if(!cv) return;
  const a=document.createElement("a"); a.download="dojo-black-belt.png"; a.href=cv.toDataURL("image/png"); a.click();
}

/* ───────────────────────── Reset ───────────────────────── */
function resetProgress(){
  if(!confirm("Reset all belt progress? This clears your saved checkpoints.")) return;
  done={}; saveState(); hideBanner(); closePanel(); renderAll();
}

document.getElementById("toriiBg").innerHTML=ICONS.torii;
window.addEventListener("resize", ()=>{ renderMap(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closePanel(); hideBanner(); } });
renderAll();
